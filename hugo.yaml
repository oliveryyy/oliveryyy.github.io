baseURL: 'https://oliveryyy.github.io/'
title: Dr. Oliver Yan
languageCode: en-us

module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-bootstrap/v5

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true

params:
  appearance:
    theme_day: minimal
    theme_night: minimal
    font: native
    font_size: L

  marketing:
    seo:
      site_type: Person
      local_business_type: ''
      org_name: ''
      description: 'Academic website of Dr. Oliver Yan, Postdoctoral Fellow at The Hong Kong Polytechnic University'

  header:
    navbar:
      enable: true
      fixed: true
      highlight_active_link: true

  footer:
    copyright:
      notice: '© {year} Oliver Yan. Built with [Hugo](https://gohugo.io/) and [HugoBlox](https://hugoblox.com/).'

  features:
    math:
      enable: false

menus:
  main:
    - name: Home
      url: '#about'
      weight: 10
    - name: Research
      url: '#research'
      weight: 20
    - name: Publications
      url: '#publications'
      weight: 30
    - name: Teaching
      url: '#teaching'
      weight: 40
    - name: CV
      url: '#cv'
      weight: 50
